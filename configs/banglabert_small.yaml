model_name: banglabert_small
model_id: csebuetnlp/banglabert_small
model_type: encoder
normalize: true
precision: fp16
batch_size: 32
grad_accum: 1
gradient_checkpointing: false
lr_grid: [3.0e-5, 5.0e-5, 1.0e-4]
epochs: 10
patience: 3
max_length: 128
warmup_ratio: 0.1
weight_decay: 0.01
marker: ["@", "@"]
head: marker
dropout: 0.1
