model_name: byt5_small
model_id: google/byt5-small
model_type: seq2seq
normalize: false
precision: fp32
# 8 x 2 needs more than the ~10 GB left on the shared T4 (the smoke test fell back to 4 x 4); it runs with the
# triton containers on the T4 stopped. On OOM, src/train.py falls back to 4 x 4 (same effective batch).
batch_size: 8
grad_accum: 2
gradient_checkpointing: false
lr_grid: [1.0e-4, 3.0e-4, 5.0e-4]
epochs: 15
patience: 3
max_length: 512
warmup_ratio: 0.1
weight_decay: 0.01
marker: ["@", "@"]
output: sentence
