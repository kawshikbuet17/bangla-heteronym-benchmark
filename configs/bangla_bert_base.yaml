model_name: bangla_bert_base
model_id: sagorsarker/bangla-bert-base
model_type: encoder
normalize: false
precision: fp16
batch_size: 32
grad_accum: 1
gradient_checkpointing: false
lr_grid: [1.0e-5, 2.0e-5, 3.0e-5, 5.0e-5]
epochs: 10
patience: 3
max_length: 128
warmup_ratio: 0.1
weight_decay: 0.01
marker: ["@", "@"]
head: marker
dropout: 0.1
# The hub repo has no tokenizer_config.json, so HF defaults to lowercasing, which strips Bangla
# vowel signs (তুমি -> তমি). The vocab keeps them, so lowercasing is turned off.
tokenizer_kwargs: {do_lower_case: false, strip_accents: false}
