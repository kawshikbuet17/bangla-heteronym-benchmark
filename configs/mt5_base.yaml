# Needs the whole T4: OOMs even at batch 1 + gradient checkpointing with ~10 GB free (fp32 AdamW states).
# Stop the two triton containers on the T4 for these runs (docker stop/start), see EXPERIMENT_LOG.md.
model_name: mt5_base
model_id: google/mt5-base
model_type: seq2seq
normalize: false
precision: fp32
batch_size: 8
grad_accum: 2
gradient_checkpointing: false
lr_grid: [1.0e-4, 3.0e-4, 5.0e-4]
epochs: 15
patience: 3
max_length: 128
warmup_ratio: 0.1
weight_decay: 0.01
marker: ["@", "@"]
output: sentence
